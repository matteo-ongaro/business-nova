name: Deploy Business Nova su GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa dipendenze e compila
        run: |
          npm ci
          npm run build

      - name: Prepara pacchetto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Pubblica online
        uses: actions/deploy-pages@v4
